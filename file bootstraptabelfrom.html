<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Pendaftaran Akun</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-body-tertiary">


    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">


                <!-- Card Utama -->

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">


                    <!-- Header -->

                    <div class="bg-success-subtle text-center p-4">

                        <div class="mb-3">

                            <span class="badge bg-white text-success rounded-pill px-3 py-2">
                                FORM PENDAFTARAN
                            </span>

                        </div>

                        <h2 class="fw-bold text-success mb-2">
                            Buat Akun Baru
                        </h2>

                        <p class="text-secondary mb-0">
                            Silakan lengkapi data diri Anda
                        </p>

                    </div>


                    <!-- Isi Form -->

                    <div class="card-body p-4 p-md-5">


                        <form action="" method="post">


                            <!-- Username -->

                            <div class="mb-4">

                                <label
                                    for="username"
                                    class="form-label fw-semibold">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    id="username"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="Masukkan username"
                                    required
                                >

                            </div>


                            <!-- Password -->

                            <div class="mb-4">

                                <label
                                    for="password"
                                    class="form-label fw-semibold">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="Masukkan password"
                                    required
                                >

                            </div>


                            <!-- Tanggal Lahir -->

                            <div class="mb-4">

                                <label
                                    for="tanggal"
                                    class="form-label fw-semibold">
                                    Tanggal Lahir
                                </label>

                                <input
                                    type="date"
                                    name="tanggal"
                                    id="tanggal"
                                    class="form-control form-control-lg rounded-3"
                                    required
                                >

                            </div>


                            <!-- Jenis Kelamin -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Jenis Kelamin
                                </label>

                                <div class="bg-body-tertiary rounded-3 p-3">

                                    <div class="form-check form-check-inline">

                                        <input
                                            type="radio"
                                            name="gender"
                                            value="Laki-laki"
                                            id="pria"
                                            class="form-check-input"
                                        >

                                        <label
                                            for="pria"
                                            class="form-check-label">
                                            Laki-laki
                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            type="radio"
                                            name="gender"
                                            value="Perempuan"
                                            id="wanita"
                                            class="form-check-input"
                                        >

                                        <label
                                            for="wanita"
                                            class="form-check-label">
                                            Perempuan
                                        </label>

                                    </div>

                                </div>

                            </div>


                            <!-- Pekerjaan -->

                            <div class="mb-4">

                                <label
                                    for="pekerjaan"
                                    class="form-label fw-semibold">
                                    Pekerjaan
                                </label>

                                <select
                                    name="pekerjaan"
                                    id="pekerjaan"
                                    class="form-select form-select-lg rounded-3"
                                    required>

                                    <option value="">
                                        Pilih pekerjaan
                                    </option>

                                    <option value="pelajar_mahasiswa">
                                        Pelajar / Mahasiswa
                                    </option>

                                    <option value="guru">
                                        Guru
                                    </option>

                                    <option value="pegawai">
                                        Pegawai
                                    </option>

                                    <option value="lainnya">
                                        Lainnya
                                    </option>

                                </select>

                            </div>


                            <!-- Deskripsi -->

                            <div class="mb-4">

                                <label
                                    for="deskripsi"
                                    class="form-label fw-semibold">
                                    Deskripsi Diri
                                </label>

                                <textarea
                                    name="deskripsi"
                                    id="deskripsi"
                                    rows="5"
                                    class="form-control rounded-3"
                                    placeholder="Ceritakan sedikit tentang diri Anda..."
                                ></textarea>

                            </div>


                            <!-- Tombol -->

                            <div class="d-grid gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-success btn-lg rounded-3">
                                    Daftar Sekarang
                                </button>

                                <button
                                    type="reset"
                                    class="btn btn-light border btn-lg rounded-3">
                                    Ulangi
                                </button>

                            </div>


                        </form>


                    </div>


                    <!-- Footer Card -->

                    <div class="text-center bg-body-tertiary py-3">

                        <small class="text-secondary">
                            Pastikan data yang Anda masukkan sudah benar.
                        </small>

                    </div>


                </div>


            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
